name: Pages

on:
  push:
    branches: [main]
  pull_request:
  # Daily drift check: the app's privacy facts can change without a push here.
  # A scheduled run checks only; it never uploads or deploys.
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions: {}

# One run per ref at a time; a newer pending run replaces an older pending one, so an older
# push can never deploy after a newer one (some intermediate pushes may be skipped).
# A pull request has its own ref, so PR runs never queue behind main. Scheduled runs only
# check, so they get their own group and can never replace a pending deploy run.
concurrency:
  group: pages-${{ github.ref }}-${{ github.event_name == 'schedule' && 'schedule' || 'run' }}
  cancel-in-progress: false

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Two commits: HEAD^1 is the previous revision on push, schedule and dispatch.
          fetch-depth: 2
          persist-credentials: false

      # The privacy check compares the policy with a trusted previous revision: the PR's base
      # commit (fetched explicitly), or the first parent of HEAD otherwise. check.sh fails if
      # PRIVACY_BASE is unset, and check_privacy.py fails if it cannot be read.
      - name: Fetch the previous revision
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            if [ -z "${PR_BASE_SHA}" ]; then
              echo "::error::pull_request event has no base sha."
              exit 1
            fi
            git fetch --no-tags --depth=1 "${SERVER_URL}/${REPOSITORY}.git" "${PR_BASE_SHA}"
            base="${PR_BASE_SHA}"
          else
            base="$(git rev-parse --verify HEAD^1)"
          fi
          git cat-file -e "${base}^{commit}"
          echo "PRIVACY_BASE=${base}" >> "${GITHUB_ENV}"

      - name: Require APP_REPO
        env:
          APP_REPO: ${{ vars.APP_REPO }}
        run: |
          if [ -z "${APP_REPO}" ]; then
            echo "::error::Repository variable APP_REPO is not set (expected owner/name of the app repository)."
            exit 1
          fi

      # The app repository is public: the default token is enough, and only the facts file is read.
      - name: Check out the app's privacy facts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.APP_REPO }}
          ref: main
          path: app-facts
          sparse-checkout: docs/privacy-facts.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # ubuntu-24.04 ships Node.js and Java 17 (vnu needs Java 11 or later).
      - name: Run site checks
        env:
          PRIVACY_FACTS: ${{ github.workspace }}/app-facts/docs/privacy-facts.json
        run: bash scripts/check.sh

      - name: Upload Pages artifact
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: deploy
    needs: check
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
